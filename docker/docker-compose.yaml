services:
    app:
        build: .
        container_name: { container_name }
        ports:
            - '8080:8080'
        environment:
            SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
            SPRING_DATA_REDIS_HOST: redis
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        depends_on:
            - mysql
            - redis
            - kafka

    mysql:
        image: mysql:latest
        container_name: { project_name }
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: { database_name }
            MYSQL_CHARACTER_SET_SERVER: utf8mb4
            MYSQL_COLLATION_SERVER: utf8mb4_general_ci
        ports:
            - '3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        command: --default-authentication-plugin=mysql_native_password

    redis:
        image: redis:latest
        container_name: { project_name }
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data

    kafka:
        image: confluentinc/cp-kafka:latest
        container_name: { project_name }
        ports:
            - '9092:9092'
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            CLUSTER_ID: '4L6_S5biTxy_S5biTxy_Sw'

        volumes:
            - kafka_log_data:/var/lib/kafka/data

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: { project_name }
        ports:
            - '8081:8080'
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        depends_on:
            - kafka

volumes:
    mysql_data:
    redis_data:
    kafka_log_data:
